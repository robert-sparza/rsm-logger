model:
  # Phase 1: stock COCO weights (auto-downloaded on first run).
  #   yolo11s.pt = faster, yolo11m.pt = good balance on an RTX 3060 Ti (8 GB), yolo11l.pt = slower/better
  # Phase 2: replace with your own trained model, e.g. runs/train/soccer-v1/weights/best.pt
  # (classes are found by name: person/player, sports ball/ball - no ids to edit).
  weights: yolo11m.pt
  imgsz: 1280            # small, far-away players need high resolution; try 1920 for 4K footage
  conf: 0.25
  tile_size: 0           # 1280 = also look for the ball in full-resolution 1280 px crops of the pitch (needs --calib; ~3-5x slower,
                         # finds smaller / farther balls). 0 = off
  tile_overlap: 0.2
  ball_conf: 0.15        # balls are small: accept less confident ball detections (the ball filter cleans up)
  device: 0              # GPU 0; use "cpu" to test without CUDA
  tracker: trackers/bytetrack_soccer.yaml  # longer memory so IDs survive occlusions
  # tracker: trackers/botsort_moving_camera.yaml  # use this for auto-tracking / zooming footage

teams:
  mode: auto               # auto = split by the two shirt colours (matches)
  # mode: bib              # training with bibs/vests: players wearing bib_color = team 1
  bib_color: neon_yellow   # neon_yellow | orange | pink | blue | red
  # (or just add --bib neon_yellow to analyze.py / live.py)

analysis:
  pitch_margin: 1.5        # metres outside the lines still counted as on the pitch

ball:
  reject_cone_colours: true  # ignore vivid orange/yellow "balls" (training cones); set false for an orange/yellow ball
